    <meta property="og:description" content="Bangladeshi payment gateway platform for bKash, Nagad, Rocket, Upay, and Cellfin with fleet SMS matching engine, automated BEFTN payout batching, Gate UI, and merchant developer tools." />

    <script>
      // Suppress benign Vite HMR WebSocket connection closed notices in iframe preview
      window.addEventListener('error', function (event) {
        if (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('@vite/client') !== -1)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && event.reason.message && (event.reason.message.indexOf('WebSocket') !== -1 || event.reason.message.indexOf('@vite/client') !== -1)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
